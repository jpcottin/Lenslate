name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/

  screenshot-tests:
    name: Screenshot Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate screenshots against references
        run: ./gradlew :app:validateDebugScreenshotTest

      - name: Upload screenshot diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-report
          path: |
            app/build/reports/screenshotTest/
            app/build/outputs/screenshotTest-results/

  release-build:
    name: Release Build (R8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      # Guards the R8/ProGuard configuration and resource shrinking.
      - name: Build minified release APK
        run: ./gradlew :app:assembleRelease

  instrumented-tests:
    name: Instrumented Tests (API ${{ matrix.api-level }}${{ matrix.suffix && format(' {0}', matrix.suffix) || '' }})
    runs-on: ubuntu-latest
    # The API 37.x legs run on preview (16 KB page-size) system images — the only
    # API 37 images available on hosted runners — so they must not gate PRs.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # minSdk is 36 (ProjectedContext.isProjectedDeviceConnected needs it).
          # google_apis images ship the on-device speech stack
          # (com.google.android.as) and ML Kit's Play Services dependencies.
          - api-level: '36'
            target: google_apis
            gpu: swiftshader_indirect
          - api-level: '37.0'
            suffix: 'stable-lavapipe'
            target: google_apis_ps16k
            gpu: lavapipe
            ram-size: 4096M
            cores: 4
            disk-size: 8192M
            experimental: true
            extra-options: -no-snapshot -camera-back none -memory 4096
          - api-level: '37.0'
            suffix: 'canary-auto'
            target: google_apis_ps16k
            channel: canary
            gpu: auto
            ram-size: 4096M
            cores: 4
            disk-size: 8192M
            experimental: true
            extra-options: -no-snapshot -camera-back none -memory 4096
          - api-level: '37.1'
            suffix: 'canary-lavapipe'
            target: google_apis_ps16k
            channel: canary
            gpu: lavapipe
            ram-size: 4096M
            cores: 4
            disk-size: 8192M
            experimental: true
            extra-options: -no-snapshot -camera-back none -memory 4096
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner image ships an outdated avdmanager that writes target=android-0
      # for minor-versioned packages (android-37.x); the emulator clamps that to
      # API 3 and skips the Vulkan/GLDirectMem auto-enable.
      - name: Update SDK cmdline-tools
        id: cmdline-tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" > /dev/null
          if [ -d "$SDK/cmdline-tools/latest-2" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/latest-2" "$SDK/cmdline-tools/latest"
          fi
          "$SDK/cmdline-tools/latest/bin/avdmanager" list device > /dev/null
          echo "version=$("$SDK/cmdline-tools/latest/bin/sdkmanager" --version 2>/dev/null | grep -Eo '^[0-9][0-9.]*' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Restore AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-${{ matrix.api-level }}-${{ matrix.target }}-tools${{ steps.cmdline-tools.outputs.version }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true' && matrix.experimental != true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          channel: ${{ matrix.channel || 'stable' }}
          ram-size: ${{ matrix.ram-size }}
          cores: ${{ matrix.cores || 2 }}
          disk-size: ${{ matrix.disk-size }}
          force-avd-creation: false
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -verbose -debug-metrics -metrics-collection -show-kernel -delay-adb -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          channel: ${{ matrix.channel || 'stable' }}
          ram-size: ${{ matrix.ram-size }}
          cores: ${{ matrix.cores || 2 }}
          disk-size: ${{ matrix.disk-size }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -verbose -debug-metrics -metrics-collection -show-kernel -delay-adb ${{ matrix.extra-options || '' }}
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            echo "===== AVD root ini ====="; cat "$HOME/.android/avd/test.ini" 2>/dev/null || echo "(test.ini not found)"
            ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results-api-${{ matrix.api-level }}${{ matrix.suffix && format('-{0}', matrix.suffix) || '' }}
          path: app/build/reports/androidTests/

  # Drives the whole emulator flow with the Android CLI
  # (https://d.android.com/tools/agents/android-cli) instead of
  # sdkmanager/avdmanager and the emulator-runner action, then exercises Listen
  # mode end to end by injecting an utterance through the debug receiver and
  # asserting the translation with `android layout`.
  android-cli:
    name: Android CLI (API 37.0 canary emulator, utterance injection)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Android CLI diagnostics
        run: |
          android --version
          android info

      - name: Install canary emulator and API 37.0 ps16k image with the CLI
        run: |
          android sdk install --canary emulator platform-tools system-images/android-37.0/google_apis_ps16k/x86_64

      # 'android emulator create' is profile-based with no way to pin an image, so
      # create the profile with the CLI and retarget it at the pinned image.
      - name: Create AVD with the CLI and retarget it to API 37.0 ps16k
        run: |
          android emulator create medium_phone
          DEVICE="$(android emulator list | head -n1)"
          AVD_DIR="$HOME/.android/avd/$DEVICE.avd"
          [ -n "$DEVICE" ] && [ -d "$AVD_DIR" ] || { echo "ERROR: created AVD not found (DEVICE='$DEVICE')"; exit 1; }
          CFG="$AVD_DIR/config.ini"
          set_ini() {
            if grep -q "^$1=" "$CFG"; then sed -i "s#^$1=.*#$1=$2#" "$CFG"; else echo "$1=$2" >> "$CFG"; fi
          }
          sed -i 's/^target=.*/target=android-37.0/' "$HOME/.android/avd/$DEVICE.ini"
          set_ini image.sysdir.1 'system-images/android-37.0/google_apis_ps16k/x86_64/'
          set_ini tag.id google_apis
          set_ini tag.display 'Google APIs'
          set_ini PlayStore.enabled false
          set_ini hw.ramSize 4096
          set_ini hw.cpu.ncore 4
          set_ini disk.dataPartition.size 8192M
          if grep -q '^tag.ids=' "$CFG"; then sed -i 's/^tag.ids=.*/tag.ids=google_apis,page_size_16kb/' "$CFG"; fi
          if grep -q '^tag.displaynames=' "$CFG"; then sed -i 's/^tag.displaynames=.*/tag.displaynames=Google APIs,16 KB Page Size/' "$CFG"; fi
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Install emulator host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 xvfb
          Xvfb :99 -screen 0 1280x800x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Start emulator with the CLI
        timeout-minutes: 15
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/platform-tools:$PATH"
          android emulator start --cold "$DEVICE"
          for _ in $(seq 1 30); do adb get-state >/dev/null 2>&1 && break; sleep 2; done
          adb get-state >/dev/null 2>&1 || { cat "$HOME/.android/$DEVICE/emulator.log" 2>/dev/null; exit 1; }
          # settings/broadcasts need a fully booted system, not just an adb connection.
          for _ in $(seq 1 60); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] || { echo "boot timeout"; cat "$HOME/.android/$DEVICE/emulator.log" 2>/dev/null; exit 1; }
          adb devices
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb logcat -v time > "${{ github.workspace }}/emulator_logcat.txt" &

      # Instrumented tests already run in the matrix job; this leg only exercises the CLI journey.
      - name: Build, run, inject an utterance and read a sign through the debug receiver
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/platform-tools:$PATH"
          ./gradlew :app:assembleDebug
          android run --apks app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant com.jpcottin.lenslate android.permission.RECORD_AUDIO
          sleep 5
          adb shell "am broadcast -a com.jpcottin.lenslate.debug.UTTERANCE -p com.jpcottin.lenslate --es text 'Bonjour tout le monde' --es from fr --es to en"
          # The first translation downloads the FR→EN models; poll the layout for the result.
          for _ in $(seq 1 24); do
            android layout > layout.json || true
            grep -qi "hello everyone" layout.json && break
            sleep 5
          done
          grep -qi "hello everyone" layout.json || { echo "ERROR: translation not found in layout"; cat layout.json; exit 1; }
          # Read mode: OCR a French sign image through the debug receiver and expect its translation.
          adb push docs/test-images/sign-fr.png /sdcard/Android/data/com.jpcottin.lenslate/files/sign-fr.png
          adb shell "am broadcast -a com.jpcottin.lenslate.debug.READ_IMAGE -p com.jpcottin.lenslate --es path sign-fr.png --es from fr --es to en"
          for _ in $(seq 1 24); do
            android layout > layout.json || true
            grep -qi "emergency exit" layout.json && break
            sleep 5
          done
          android screen capture -o lenslate-phone.png || true
          grep -qi "emergency exit" layout.json || { echo "ERROR: read-mode translation not found in layout"; cat layout.json; exit 1; }

      # Building the minified APK is not enough: an R8 rule regression (stripped ML Kit
      # registrar constructors) once produced a release that crashed on launch while every
      # build job stayed green. Launch it and make sure the process survives.
      - name: Smoke-launch the minified release APK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/platform-tools:$PATH"
          ./gradlew :app:assembleRelease
          adb install -r app/build/outputs/apk/release/app-release.apk
          adb logcat -c
          adb shell am start -W -n com.jpcottin.lenslate/.MainActivity
          sleep 8
          adb shell pidof com.jpcottin.lenslate || { echo "ERROR: release app died on launch"; adb logcat -d | grep -A30 "FATAL EXCEPTION" | head -60; exit 1; }
          adb logcat -d | grep -q "FATAL EXCEPTION" && { echo "ERROR: crash in logcat"; adb logcat -d | grep -A30 "FATAL EXCEPTION" | head -60; exit 1; } || true

      - name: Stop emulator
        if: always()
        run: android emulator stop "$DEVICE" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-cli-artifacts
          path: |
            lenslate-phone.png
            layout.json
            emulator_logcat.txt
            app/build/reports/androidTests/
          if-no-files-found: ignore
