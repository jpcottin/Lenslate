name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build release APK and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build minified release APK
        run: ./gradlew :app:assembleRelease

      # The release build type is signed with the debug keystore (see app/build.gradle.kts),
      # so AGP writes app-release.apk, not app-release-unsigned.apk.
      - name: Rename APK with the tag
        run: cp app/build/outputs/apk/release/app-release.apk "Lenslate-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: Lenslate-*.apk
          generate_release_notes: true
