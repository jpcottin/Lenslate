name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build release APK and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build minified release APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK with the tag
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "Lenslate-${GITHUB_REF_NAME}-unsigned.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Lenslate-*-unsigned.apk
          generate_release_notes: true
