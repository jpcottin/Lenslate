name: Dependency Review

# Flags newly introduced dependencies with known vulnerabilities or disallowed licenses on PRs.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: on-failure
